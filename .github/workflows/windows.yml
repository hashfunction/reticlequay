name: Windows build and package validation
on:
  workflow_dispatch:
  push:
    branches: [codex/reticlequay]
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Remove committed macOS sample capture
        shell: pwsh
        run: Remove-Item -LiteralPath docs/controls-smoke.png -Force
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Exercise actual Windows Electron UI
        run: npm run test:smoke
      - name: Build Windows portable application
        run: npm run package:win
      - name: Build unsigned Microsoft Store package
        shell: pwsh
        run: ./scripts/package-msix.ps1
      - name: Install, exercise, and uninstall signed test copy
        shell: pwsh
        run: ./scripts/test-msix-install.ps1
      - name: Preserve package and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ReticleQuay-Windows-x64
          path: |
            build/*.msix
            build/build-evidence.json
            docs/controls-smoke.png
          if-no-files-found: error
          retention-days: 14
